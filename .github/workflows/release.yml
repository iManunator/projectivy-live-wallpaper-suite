name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/imanunator/projectivy-live-wallpaper-suite

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=true
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build sideload APKs
        working-directory: plugin
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp plugin/app/build/outputs/apk/debug/app-debug.apk dist/live-wallpaper-plugin-debug.apk
          cp plugin/app/build/outputs/apk/release/app-release.apk dist/live-wallpaper-plugin-release.apk
          cp docker-compose.yml dist/
          cp config.example.json dist/
          cp CHANGELOG.md dist/
          echo "${IMAGE}:latest" > dist/IMAGE.txt
          echo "${{ github.ref_name }}" > dist/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-pack
          path: dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          body: |
            ## Projectivy Live Wallpaper Suite ${{ github.ref_name }}

            - **Container image:** `ghcr.io/imanunator/projectivy-live-wallpaper-suite:${{ github.ref_name }}` (also `:latest`)
            - **Plugin APKs:** `live-wallpaper-plugin-release.apk` (sideload) and `live-wallpaper-plugin-debug.apk`
            - **Compose / config:** `docker-compose.yml`, `config.example.json`

            Install: see [docs/INSTALL.md](docs/INSTALL.md). Parallax VIDEO: [docs/MOTION.md](docs/MOTION.md).
            SeerChannel (Preview Channels) is not included.
          files: |
            dist/live-wallpaper-plugin-debug.apk
            dist/live-wallpaper-plugin-release.apk
            dist/docker-compose.yml
            dist/config.example.json
            dist/CHANGELOG.md
