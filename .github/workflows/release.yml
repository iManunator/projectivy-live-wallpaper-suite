name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/imanunator/wallpaparr

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=true
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platforms
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build sideload APKs
        working-directory: plugin
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp plugin/app/build/outputs/apk/debug/app-debug.apk dist/wallpaparr-plugin-debug.apk
          cp plugin/app/build/outputs/apk/release/app-release.apk dist/wallpaparr-plugin-release.apk
          cp docker-compose.yml dist/
          cp config.example.json dist/
          cp CHANGELOG.md dist/
          echo "${IMAGE}:latest" > dist/IMAGE.txt
          echo "${{ github.ref_name }}" > dist/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wallpaparr-release-pack
          path: dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          body: |
            ## Wallpaparr ${{ github.ref_name }}

            Cinematic Projectivy wallpapers (stills + optional parallax VIDEO).

            - **Container image:** `ghcr.io/imanunator/wallpaparr:${{ github.ref_name }}` (also `:latest`)
            - **Plugin APKs:** `wallpaparr-plugin-release.apk` (sideload) and `wallpaparr-plugin-debug.apk`
            - **Compose / config:** `docker-compose.yml`, `config.example.json`

            Local verify (builds Dockerfile, demo catalog, no Jellyfin): `./scripts/verify.sh`
            Install: [docs/INSTALL.md](docs/INSTALL.md). Parallax: [docs/MOTION.md](docs/MOTION.md).
            SeerChannel (Preview Channels) is not included.
          files: |
            dist/wallpaparr-plugin-debug.apk
            dist/wallpaparr-plugin-release.apk
            dist/docker-compose.yml
            dist/config.example.json
            dist/CHANGELOG.md
