# Wallpaparr — cinematic Projectivy wallpapers.
# Local verify always builds the Dockerfile (`docker compose up --build`).
# `image:` is the tag applied to that local build, and the name used if you later `docker compose pull` from GHCR.
services:
  wallpaparr:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/imanunator/wallpaparr:latest
    container_name: wallpaparr
    ports:
      - "8787:8787"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      SUITE_DATA: /data
      SUITE_LAYOUTS: /data/layouts
      SUITE_GALLERY: /data/gallery
      SUITE_CONFIG: /data/config.json
    volumes:
      - ./data:/data
      - ./config.example.json:/data/config.example.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
    restart: unless-stopped
